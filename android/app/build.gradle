apply plugin: 'com.android.application'

// 릴리스 서명 정보는 저장소에 절대 들어가지 않는다.
// 읽는 순서: android/keystore.properties(로컬 파일, .gitignore에 있음) -> 환경변수.
// 둘 다 없으면 서명 설정 자체를 만들지 않고, 릴리스 빌드는 서명되지 않은
// 결과물을 낸다. 빌드가 조용히 실패하는 대신 무엇이 없는지 로그로 말한다.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String key, String env ->
    def value = keystoreProperties.getProperty(key)
    if (value == null || value.trim().isEmpty()) value = System.getenv(env)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}

def releaseStorePath = signingValue('storeFile', 'OING_KEYSTORE_FILE')
def releaseStore = releaseStorePath == null ? null : rootProject.file(releaseStorePath)
def hasReleaseSigning = releaseStore != null && releaseStore.exists()
if (!hasReleaseSigning) {
    logger.lifecycle("[oing] 서명 정보 없음 - 릴리스 빌드는 서명되지 않습니다. " +
        "android/keystore.properties를 만들거나 OING_KEYSTORE_* 환경변수를 설정하세요.")
}

def adValue = { String propertyName, String fallback ->
    def value = project.findProperty(propertyName)
    if (value == null || value.toString().trim().isEmpty()) value = System.getenv(propertyName)
    return (value == null || value.toString().trim().isEmpty()) ? fallback : value.toString().trim()
}
def sampleAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleRewardedId = 'ca-app-pub-3940256099942544/5224354917'
def sampleInterstitialId = 'ca-app-pub-3940256099942544/1033173712'
def admobAppId = adValue('OING_ADMOB_APP_ID', sampleAdMobAppId)
def admobRewardedId = adValue('OING_ADMOB_REWARDED_ID', sampleRewardedId)
def admobInterstitialId = adValue('OING_ADMOB_INTERSTITIAL_ID', sampleInterstitialId)
def admobTestMode = admobAppId == sampleAdMobAppId ||
    admobRewardedId == sampleRewardedId || admobInterstitialId == sampleInterstitialId
def admobTestAdsEnabled = adValue('OING_ADMOB_ENABLE_TEST_ADS', 'false').toBoolean()
def admobEnabled = !admobTestMode || admobTestAdsEnabled
def admobMode = !admobEnabled ? 'disabled' : (admobTestMode ? 'Google test ads' : 'live ad units')
logger.lifecycle("[oing] AdMob mode: ${admobMode}")

android {
    namespace = "com.oinggame.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oinggame.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.1.1"
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField "String", "ADMOB_REWARDED_AD_UNIT_ID", "\"${admobRewardedId}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_AD_UNIT_ID", "\"${admobInterstitialId}\""
        buildConfigField "boolean", "ADMOB_TEST_MODE", admobTestMode.toString()
        buildConfigField "boolean", "ADMOB_ENABLED", admobEnabled.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStore
                storePassword signingValue('storePassword', 'OING_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'OING_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'OING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
