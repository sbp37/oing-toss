name: Deploy to GitHub Pages

# 저장소를 Public으로 바꾼 뒤 이 워크플로를 실행하면 Pages가 자동으로 켜지고
# 저장소 루트(index.html)가 https://<owner>.github.io/oing-toss/ 로 배포된다.
# 별도 브랜치(main) 머지 없이 이 브랜치에서 바로 배포한다.

# 수동 실행 전용(workflow_dispatch). 자동 배포는 Settings → Pages 의
# "Deploy from a branch"(권장, 이 워크플로 불필요) 또는 Source를 "GitHub Actions"로
# 바꾼 뒤 이 워크플로를 돌리면 된다. (기본 토큰이 read-only면 Actions 방식은
# Settings → Actions → General → Workflow permissions → "Read and write" 필요)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pages 미설정 시 워크플로에서 자동 활성화
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
