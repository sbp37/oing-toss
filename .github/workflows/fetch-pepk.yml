# PEPK 도구를 구글 공식 URL에서 받아 릴리스 자산으로 올린다.
#
# 키를 다루는 작업이 아니다. 이 저장소를 만지는 개발 환경에서는 구글 호스트가
# 막혀 있어서 도구 자체를 받을 수 없고, 러너는 막혀 있지 않다. 받은 파일의
# SHA-256을 로그에 남겨 옮겨온 파일이 같은 것인지 확인할 수 있게 한다.
#
# pepk.jar는 구글이 공개 배포하는 도구라 릴리스에 올려도 새는 것이 없다.
# 키스토어와 비밀번호는 이 워크플로에 등장하지 않는다.
name: Fetch PEPK tool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 내려받기
        run: |
          set -e
          curl -fsSL -o pepk.jar \
            https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          ls -la pepk.jar
          echo "SHA-256:"
          sha256sum pepk.jar

      - name: 릴리스로 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 체크아웃을 하지 않는 잡이라 gh가 저장소를 스스로 알아내지 못한다.
          TAG="tools-pepk"
          export GH_REPO="${{ github.repository }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" pepk.jar \
            --prerelease \
            --title "PEPK 도구" \
            --notes "구글 공식 배포본을 그대로 옮긴 것. SHA-256: $(sha256sum pepk.jar | cut -d' ' -f1)"
